services:
  postgres:
    image: postgres:16-alpine
    container_name: student-course-postgres
    environment:
      POSTGRES_DB: student_course_registration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-course-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/student_course_registration
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8081

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: student-course-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data: